<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Box Designer responsive QA</title>
    <style>
      :root {
        color: #eee2bd;
        background: #11120f;
        font-family: ui-monospace, monospace;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      p {
        max-width: 72ch;
        color: #aca384;
      }

      section {
        margin-block: 32px;
      }

      h2 {
        margin: 0 0 8px;
        color: #d69b19;
        font-size: 14px;
      }

      .viewport {
        overflow: hidden;
        border: 1px solid #796d4c;
        background: #000;
      }

      iframe {
        display: block;
        border: 0;
        transform-origin: top left;
      }

      .desktop-1280 {
        width: 1152px;
        height: 648px;
      }

      .desktop-1280 iframe {
        width: 1280px;
        height: 720px;
        transform: scale(0.9);
      }

      .desktop-1920 {
        width: 1190px;
        height: 670px;
      }

      .desktop-1920 iframe {
        width: 1920px;
        height: 1080px;
        transform: scale(0.62);
      }

      .narrow-434 {
        width: 434px;
        height: 720px;
      }

      .narrow-434 iframe {
        width: 434px;
        height: 720px;
      }
    </style>
  </head>
  <body>
    <h1>THE DESIGNER · RESPONSIVE QA HARNESS</h1>
    <p>
      Development fixtures only. Each frame has the exact internal viewport
      named above it; scaling affects only this review page, not the iframe's
      layout calculations.
    </p>
    <section>
      <h2>1280 × 720 · DISPLAYED AT 90%</h2>
      <div class="viewport desktop-1280">
        <iframe
          title="Designer at 1280 by 720"
          src="/?qa=qong-designer&viewport=1280x720"
        ></iframe>
      </div>
    </section>
    <section>
      <h2>1920 × 1080 · DISPLAYED AT 62%</h2>
      <div class="viewport desktop-1920">
        <iframe
          title="Designer at 1920 by 1080"
          src="/?qa=qong-designer&viewport=1920x1080"
        ></iframe>
      </div>
    </section>
    <section>
      <h2>434 × 720 · DISPLAYED AT 100%</h2>
      <div class="viewport narrow-434">
        <iframe
          title="Designer at 434 by 720"
          src="/?qa=qong-designer&viewport=434x720"
        ></iframe>
      </div>
    </section>
    <script>
      const targetStage = new URLSearchParams(location.search).get("stage");
      if (targetStage === "selector") {
        document.querySelector("h1").textContent += " · SELECTOR STAGE";
        const actions = [
          "continue",
          "continue",
          "continue",
          "prepare-zero",
          "apply-hadamard",
          "reveal-recorded-measurement",
          "map-direct",
          "assemble-rally-pack",
        ];
        const advance = async (frame) => {
          await new Promise((resolve) => setTimeout(resolve, 750));
          for (const action of actions) {
            const button = frame.contentDocument?.querySelector(
              `[data-designer-action="${action}"]`,
            );
            if (button?.tagName !== "BUTTON") break;
            button.click();
            await new Promise((resolve) => setTimeout(resolve, 30));
          }
        };
        for (const frame of document.querySelectorAll("iframe")) {
          if (frame.contentDocument?.readyState === "complete") {
            void advance(frame);
          } else {
            frame.addEventListener("load", () => void advance(frame), {
              once: true,
            });
          }
        }
      }
    </script>
  </body>
</html>
