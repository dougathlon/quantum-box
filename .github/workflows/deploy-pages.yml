name: Verify and deploy Quantum Box to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python audit dependency
        run: python -m pip install --requirement requirements-ci.txt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production and development dependencies
        run: pnpm audit --audit-level moderate

      - name: Scan the public source snapshot
        run: pnpm scan:source

      - name: Run the release gate
        run: pnpm check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload the verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-webkit-1280x720
            browser: webkit
          - project: desktop-firefox-1280x720
            browser: firefox
          - project: desktop-1280x720
            browser: chromium
          - project: desktop-1920x1080
            browser: chromium
          - project: narrow-434x720
            browser: chromium
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - name: Check out the release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python audit dependency
        run: python -m pip install --requirement requirements-ci.txt
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the browser runtime
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Check Firefox bitmap rendering
        if: matrix.browser == 'firefox'
        run: pnpm test:e2e tests/e2e/shell-corrections.spec.ts --project=${{ matrix.project }} --reporter=line
      - name: Execute browser journeys
        run: pnpm test:e2e --project=${{ matrix.project }} --reporter=line --max-failures=5
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures-${{ matrix.project }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
